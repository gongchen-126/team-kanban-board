<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>团队任务看板</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>团队任务看板</h1>
    <form id="task-form">
      <input type="text" id="task-input" placeholder="输入任务标题..." required>
      <select id="task-status">
        <option value="todo">待办</option>
        <option value="doing">进行中</option>
        <option value="done">完成</option>
      </select>
      <button type="submit">添加任务</button>
    </form>
  </header>
  <main>
    <section class="column" id="col-todo" data-status="todo">
      <h2>待办</h2>
      <div class="task-list"></div>
    </section>
    <section class="column" id="col-doing" data-status="doing">
      <h2>进行中</h2>
      <div class="task-list"></div>
    </section>
    <section class="column" id="col-done" data-status="done">
      <h2>完成</h2>
      <div class="task-list"></div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
